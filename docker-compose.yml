      context: ./services/media
    restart: unless-stopped
    environment:
      PORT: 3004
      NODE_ENV: ${NODE_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "3004:3004"
    networks:
      - backend
    profiles: [monitoring]
    depends_on:
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  jaeger:
    image: jaegertracing/all-in-one:1.58
    restart: unless-stopped
    profiles: [monitoring]
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - backend

  notification:
    build:
      context: ./services/notification
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "3002:3002"
    networks:
      - backend
    profiles: [monitoring]
    depends_on:
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  search:
    build:
      context: ./services/search
    restart: unless-stopped
    environment:
      PORT: 3003
      NODE_ENV: ${NODE_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
