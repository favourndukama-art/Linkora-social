    restart: unless-stopped
    environment:
      PORT: 3004
      NODE_ENV: ${NODE_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "3004:3004"
    networks:
      - backend
    profiles: [monitoring]
    depends_on:
