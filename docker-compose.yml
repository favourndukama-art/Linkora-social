version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Dev-only default credentials — postgres:16-alpine refuses to start
      # without POSTGRES_PASSWORD. Override via a .env file for anything
      # beyond local development.
      POSTGRES_USER: ${POSTGRES_USER:-linkora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkora}
      POSTGRES_DB: ${POSTGRES_DB:-linkora}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkora}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          # PostgreSQL is shared by all services; 512 MB is sufficient for
          # a dev dataset. Raise via POSTGRES_SHARED_BUFFERS in production.
          memory: 512M
        reservations:
          memory: 128M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Rate-limit counters only — losing them on restart costs at most one
    # window of enforcement, so no persistence is configured.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          # Redis is used only for rate-limit counters; 64 MB is ample.
          memory: 64M
        reservations:
          memory: 32M

  indexer:
    build:
      context: ./services/indexer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkora}:${POSTGRES_PASSWORD:-linkora}@postgres:5432/${POSTGRES_DB:-linkora}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      CONTRACT_ID: ${CONTRACT_ID:-}
      START_LEDGER: ${START_LEDGER:-0}
      PORT: 3000
      # Required for shared rate limiting. Without it each replica keeps its
      # own counters and the effective limit becomes limit x replicaCount.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "3000:3000"
    networks:
      - backend
      - database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # Indexer performs full-text search and event replay; 512 MB
          # mirrors the search-service limit from the DevOps spec.
          memory: 512M
        reservations:
          memory: 128M

  dm-relay:
    build:
      context: ./services/dm-relay
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkora}:${POSTGRES_PASSWORD:-linkora}@postgres:5432/${POSTGRES_DB:-linkora}_dm_relay
      PORT: 3001
      STELLAR_NETWORK: ${STELLAR_NETWORK:-Testnet}
      # Required for shared rate limiting (HTTP and WebSocket).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "3001:3001"
    networks:
      - backend
      - database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # DM relay handles WebSocket connections and E2EE message routing;
          # 256 MB matches the notification-service limit from the DevOps spec.
          memory: 256M
        reservations:
          memory: 64M

  analytics-oracle:
    build:
      context: ./services/analytics-oracle
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkora}:${POSTGRES_PASSWORD:-linkora}@postgres:5432/${POSTGRES_DB:-linkora}
      SOROBAN_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      CONTRACT_ID: ${CONTRACT_ID:-}
      # Signing key is read from a mounted secret FILE (hex-encoded 32-byte
      # Ed25519 seed), never from an environment variable. Mount the file:
      #   ORACLE_KEY_FILE=${PWD}/oracle-key.hex
      SECRETS: file://${ORACLE_KEY_FILE:-/run/secrets/oracle-key.hex}
      # Bearer token for the authenticated POST /admin/rotate-key endpoint.
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      ORACLE_NAME: ${ORACLE_NAME:-default}
      WINDOW_LEDGERS: ${WINDOW_LEDGERS:-1000}
      PORT: 4000
      # Required for shared rate limiting.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "4000:4000"
    volumes:
      # Bind-mount the oracle signing key file into the container.
      - ${ORACLE_KEY_FILE:-./oracle-key.hex}:/run/secrets/oracle-key.hex:ro
    networks:
      - backend
      - database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # Analytics oracle aggregates on-chain metrics; 512 MB matches the
          # media-service limit from the DevOps spec.
          memory: 512M
        reservations:
          memory: 128M

  notification:
    image: linkora-notification:latest
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkora}:${POSTGRES_PASSWORD:-linkora}@postgres:5432/${POSTGRES_DB:-linkora}
      PORT: ${NOTIFICATION_PORT:-3002}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "3002:3002"
    networks:
      - backend
      - database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  search:
    image: linkora-search:latest
    build:
      context: .
      dockerfile: services/search/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkora}:${POSTGRES_PASSWORD:-linkora}@postgres:5432/${POSTGRES_DB:-linkora}
      PORT: ${SEARCH_PORT:-3004}
      HOST: ${SEARCH_HOST:-0.0.0.0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3004:3004"
    networks:
      - backend
      - database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  media:
    image: linkora-media:latest
    build:
      context: ./services/media
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${MEDIA_PORT:-3003}
      HOST: ${MEDIA_HOST:-0.0.0.0}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-linkora-media}
      MEDIA_ENDPOINT: ${MEDIA_ENDPOINT:-}
      MEDIA_ACCESS_KEY: ${MEDIA_ACCESS_KEY:-}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      CDN_BASE_URL: ${CDN_BASE_URL:-http://localhost:3003}
      CDN_SIGNING_SECRET: ${CDN_SIGNING_SECRET:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "3003:3003"
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  notification:
    build:
      context: ./services/notification
    restart: unless-stopped
    environment:
      PORT: 3002
    ports:
      - "3002:3002"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  search:
    build:
      context: ./services/search
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkora}:${POSTGRES_PASSWORD:-linkora}@postgres:5432/${POSTGRES_DB:-linkora}
      PORT: 3004
    ports:
      - "3004:3004"
    networks:
      - backend
      - database
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  notification:
    build:
      context: ./services/notification
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "3002:3002"
    networks:
      - backend
    profiles: [monitoring]
    depends_on:
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  search:
    build:
      context: ./services/search
    restart: unless-stopped
    environment:
      PORT: 3003
      NODE_ENV: ${NODE_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "3003:3003"
    networks:
