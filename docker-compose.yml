    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  jaeger:
    image: jaegertracing/all-in-one:1.58
    restart: unless-stopped
