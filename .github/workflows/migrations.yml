name: Migration Tests

on:
  push:
    branches:
      - main
    paths:
      - "services/indexer/migrations/**"
      - "tests/migrations/**"
      - "docker-compose.migrations.yml"
      - ".github/workflows/migrations.yml"
  pull_request:
    paths:
      - "services/indexer/migrations/**"
      - "tests/migrations/**"
      - "docker-compose.migrations.yml"
      - ".github/workflows/migrations.yml"

jobs:
  migrations:
    name: Indexer DB Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run migration test suite
        run: bash tests/migrations/test-migrations.sh

      - name: Verify migration count (016–020 must be present)
        run: |
          EXPECTED_MIN=20
          ACTUAL=$(ls services/indexer/migrations/*.sql | wc -l)
          echo "Migration files found: $ACTUAL"
          if [ "$ACTUAL" -lt "$EXPECTED_MIN" ]; then
            echo "ERROR: expected at least $EXPECTED_MIN migration files, found $ACTUAL" >&2
            exit 1
          fi
          echo "✅ Migration count OK ($ACTUAL files)"

      - name: Add migration summary
        if: always()
        run: |
          echo "## Migration Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          TOTAL=$(ls services/indexer/migrations/*.sql | wc -l)
          echo "- Total migration files: **$TOTAL**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Latest migrations: 016_reputation_scores, 017_creator_analytics, 018_search_index, 019_media_attachments, 020_outbound_webhooks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Schema snapshot: \`tests/migrations/expected-schema.sql\`" >> "$GITHUB_STEP_SUMMARY"
